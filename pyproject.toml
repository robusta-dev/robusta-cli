[tool.poetry]
name = "robusta-cli"
version = "0.0.0"
description = ""
authors = ["Natan Yellin <aantn@users.noreply.github.com>"]
readme = "README.md"

[tool.poetry.scripts]
robusta = "robusta_cli.main:app"

[tool.poetry.dependencies]
python = "^3.10, <3.13"
typer = "^0.12.3"
pyyaml = "^6.0.1"
click-spinner = "^0.1.10"
cryptography = {version = "48.0.1", python = ">=3.9.2,<3.13"}  # 48.0.1 fixes GHSA-537c-gmf6-5ccf (High)
dpath = "^2.0.5"
pydantic = "^1.0"
slack-sdk = "^3"
pyjwt = "^2.13.0"  # >=2.13.0 fixes CVE-2026-48526 (High)
requests = "^2.33.0"
certifi = "2024.7.4"
types-toml = "^0.10.2"
toml = "^0.10.2"
hikaru-model-28 = "^1.1.0"
kubernetes = "^29"
urllib3 = ">=2.7.0"
click = "8.1.8"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
